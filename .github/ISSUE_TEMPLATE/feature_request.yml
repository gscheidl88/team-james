name: Feature request
description: Suggest an improvement to the framework, tooling, or docs.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What workflow gap are you trying to solve?
      placeholder: I want a cleaner way to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the capability, behavior, or documentation change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What are you doing today instead?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What would make this feel complete?
