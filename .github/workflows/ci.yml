name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  workflow-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run workflow eval harness
        run: uv run --python 3.12 tools/evals/run_workflow_evals.py

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-eval-review
          path: |
            memory/reviews/workflow-eval-review.json
            memory/reviews/workflow-eval-review.md
            memory/reviews/workflow-eval-history.jsonl
          if-no-files-found: ignore
