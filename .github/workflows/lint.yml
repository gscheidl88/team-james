name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  wiki-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run wiki and skill lint
        run: uv run --python 3.12 tools/wiki/wiki_lint.py --strict
